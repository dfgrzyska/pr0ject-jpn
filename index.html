<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shmup JP" />
    <meta name="theme-color" content="#0b0a12" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Shmup Japonia</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a12;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Frame around the playfield when the screen is wider than 9:16. */
      #game {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        /* keep the playfield clear of notches / home indicators (PWA uses viewport-fit=cover) */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          repeating-linear-gradient(90deg, #0b0a12 0 22px, #100d18 22px 24px),
          #0b0a12;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        box-shadow: 0 0 0 2px #1c1418, 0 0 0 3px #5e1a12, 0 0 40px #000;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
